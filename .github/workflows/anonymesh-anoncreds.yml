name: ANONYMESH AnonCreds integration
on:
  push:
    branches: [feat/anonymesh-private-agent-identity]
    paths:
      - "packages/anoncreds-agent-demo/**"
      - ".github/workflows/anonymesh-anoncreds.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/anoncreds-agent-demo/**"
      - ".github/workflows/anonymesh-anoncreds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anoncreds-native-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: packages/anoncreds-agent-demo/package.json
      - name: Install official AnonCreds Node.js wrapper and native release
        run: npm install --prefix packages/anoncreds-agent-demo --no-audit --no-fund
      - name: Run issuer-holder-verifier and adversarial tests
        run: npm test --prefix packages/anoncreds-agent-demo
      - name: Run demo and report non-sensitive metrics
        run: npm run demo --prefix packages/anoncreds-agent-demo
