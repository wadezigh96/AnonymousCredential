name: ANONYMESH AnonCreds process integration

on:
  push:
    branches:
      - feat/anonymesh-private-agent-identity
      - test/issuer-state-persistence-linux
    paths:
      - 'packages/anoncreds-agent-demo/**'
      - '.github/workflows/anonymesh-anoncreds-integration.yml'
  pull_request:
    paths:
      - 'packages/anoncreds-agent-demo/**'
      - '.github/workflows/anonymesh-anoncreds-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anoncreds-process-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Install AnonCreds dependencies
        working-directory: packages/anoncreds-agent-demo
        run: npm install --no-audit --no-fund --package-lock=false --ignore-scripts=false

      - name: Test persistent issuer state and lock safety
        working-directory: packages/anoncreds-agent-demo
        run: node --test test/issuer-state-store.test.mjs

      - name: Test NEAR registry to verifier integration
        working-directory: packages/anoncreds-agent-demo
        run: node --test test/near-issuer-registry.test.mjs test/paai-verifier.test.mjs

      - name: Run SQLite atomic rollback test
        working-directory: packages/anoncreds-agent-demo
        run: node --test test/sqlite-atomic-authorization.test.mjs

      - name: Run multi-process authorization integration test
        working-directory: packages/anoncreds-agent-demo
        run: npm test -- --test-name-pattern="separate issuer, holder and verifier processes"

      - name: Run complete AnonCreds test suite
        working-directory: packages/anoncreds-agent-demo
        run: npm test
