name: ANONYMESH NEAR contract

on:
  push:
    branches:
      - feat/anonymesh-private-agent-identity
    paths:
      - 'contracts/near/issuer-registry/**'
      - '.github/workflows/anonymesh-near-contract.yml'
  pull_request:
    paths:
      - 'contracts/near/issuer-registry/**'
      - '.github/workflows/anonymesh-near-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near/issuer-registry -> target
      - name: Run issuer registry unit tests with locked dependencies
        working-directory: contracts/near/issuer-registry
        run: cargo test --locked
      - name: Build WebAssembly contract with locked dependencies
        working-directory: contracts/near/issuer-registry
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --target wasm32-unknown-unknown --release
