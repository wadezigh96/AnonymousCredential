name: ANONYMESH NEAR contract

on:
  push:
    branches:
      - feat/anonymesh-private-agent-identity
      - fix/anonymesh-testnet-readiness, fix/anonymesh-github-readiness-2026-11-17
    paths:
      - 'contracts/near/issuer-registry/**'
      - '.github/workflows/anonymesh-near-contract.yml'
  pull_request:
    paths:
      - 'contracts/near/issuer-registry/**'
      - '.github/workflows/anonymesh-near-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near/issuer-registry -> target
      - name: Run issuer registry unit tests with locked dependencies
        working-directory: contracts/near/issuer-registry
        run: cargo test --locked
      - name: Build WebAssembly contract with locked dependencies
        working-directory: contracts/near/issuer-registry
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --target wasm32-unknown-unknown --release
      - name: Record reproducible WASM metadata and checksum
        working-directory: contracts/near/issuer-registry
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          wasm_path="target/wasm32-unknown-unknown/release/anonymesh_issuer_registry.wasm"
          test -s "$wasm_path"
          printf '%s\n' "$SOURCE_SHA" > SOURCE_SHA.txt
          printf '%s\n' 'cargo build --locked --target wasm32-unknown-unknown --release' > BUILD_COMMAND.txt
          sha256sum "$wasm_path" | tee SHA256SUMS.txt
      - name: Upload exact release WASM and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: anonymesh-issuer-registry-wasm-${{ github.sha }}
          if-no-files-found: error
          path: |
            contracts/near/issuer-registry/target/wasm32-unknown-unknown/release/anonymesh_issuer_registry.wasm
            contracts/near/issuer-registry/SOURCE_SHA.txt
            contracts/near/issuer-registry/BUILD_COMMAND.txt
            contracts/near/issuer-registry/SHA256SUMS.txt
