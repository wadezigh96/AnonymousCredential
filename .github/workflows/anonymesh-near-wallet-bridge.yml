name: ANONYMESH NEAR wallet bridge

on:
  push:
    branches:
      - fix/anonymesh-testnet-readiness
    paths:
      - 'apps/near-wallet-bridge/**'
      - '.github/workflows/anonymesh-near-wallet-bridge.yml'
  pull_request:
    paths:
      - 'apps/near-wallet-bridge/**'
      - '.github/workflows/anonymesh-near-wallet-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned wallet connector and build tooling
        working-directory: apps/near-wallet-bridge
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run account preflight unit tests
        working-directory: apps/near-wallet-bridge
        run: npm test
      - name: Build read-only wallet bridge
        working-directory: apps/near-wallet-bridge
        run: npm run build
